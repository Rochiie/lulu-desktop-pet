<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; media-src 'self'">
  <title>Lulu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Stacked in this order: her shadow, things behind her, her, things in front, snow. -->
  <canvas id="shadow" class="layer" aria-hidden="true"></canvas>
  <canvas id="back" class="layer" aria-hidden="true"></canvas>
  <canvas id="stage"></canvas>
  <canvas id="front" class="layer" aria-hidden="true"></canvas>
  <canvas id="snow" class="layer" aria-hidden="true"></canvas>
  <div id="media" aria-hidden="true"></div>
  <div id="tune" hidden></div>
  <script src="logic.js"></script>
  <script src="root-motion.js"></script>
  <script src="config.js"></script>
  <script src="player.js"></script>
  <script src="behaviour.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
